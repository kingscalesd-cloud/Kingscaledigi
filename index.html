<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Kingscale Digitals</title>

  <style>
    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    /* =====================================================
       BODY
    ===================================================== */

    html {
      min-height: 100%;
      background: #020806;
    }

    body {
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #ffffff;

      background: #020806;

      position: relative;

      overflow-x: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;
    }


    /* =====================================================
       LIQUID GOLD BACKGROUND
    ===================================================== */

    .fluid-bg {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(53, 115, 70, 0.18),
          transparent 35%
        ),

        radial-gradient(
          circle at 80% 75%,
          rgba(218, 169, 48, 0.15),
          transparent 40%
        ),

        #020806;

      z-index: 0;

      pointer-events: none;
    }


    /* =====================================================
       LIQUID STREAMS
    ===================================================== */

    .liquid {
      position: absolute;

      top: -35%;

      width: 220px;
      height: 170%;

      border-radius: 50%;

      filter: blur(22px);

      opacity: 0.55;

      background:
        linear-gradient(
          180deg,

          transparent 0%,

          rgba(102, 76, 15, 0.12) 12%,

          rgba(178, 132, 25, 0.35) 28%,

          rgba(239, 195, 72, 0.68) 45%,

          rgba(210, 163, 43, 0.40) 55%,

          rgba(65, 112, 54, 0.30) 72%,

          rgba(21, 59, 35, 0.15) 85%,

          transparent 100%
        );
    }


    /* First stream */

    .liquid-one {
      left: -8%;

      transform: rotate(16deg);

      animation:
        liquidOne 12s ease-in-out infinite alternate;
    }


    /* Second stream */

    .liquid-two {
      left: 35%;

      width: 260px;

      opacity: 0.40;

      transform: rotate(-14deg);

      animation:
        liquidTwo 15s ease-in-out infinite alternate;
    }


    /* Third stream */

    .liquid-three {
      right: -8%;

      width: 210px;

      opacity: 0.45;

      transform: rotate(18deg);

      animation:
        liquidThree 14s ease-in-out infinite alternate;
    }


    /* =====================================================
       LIQUID ANIMATIONS
    ===================================================== */

    @keyframes liquidOne {

      0% {
        transform:
          translateX(-30px)
          rotate(16deg)
          scaleY(1);
      }

      50% {
        transform:
          translateX(30px)
          rotate(20deg)
          scaleY(1.04);
      }

      100% {
        transform:
          translateX(110px)
          rotate(25deg)
          scaleY(1.10);
      }
    }


    @keyframes liquidTwo {

      0% {
        transform:
          translateX(60px)
          rotate(-14deg)
          scaleY(1);
      }

      50% {
        transform:
          translateX(-20px)
          rotate(-18deg)
          scaleY(1.05);
      }

      100% {
        transform:
          translateX(-100px)
          rotate(-23deg)
          scaleY(1.12);
      }
    }


    @keyframes liquidThree {

      0% {
        transform:
          translateX(30px)
          rotate(18deg)
          scaleY(1);
      }

      50% {
        transform:
          translateX(-20px)
          rotate(14deg)
          scaleY(1.05);
      }

      100% {
        transform:
          translateX(-90px)
          rotate(9deg)
          scaleY(1.10);
      }
    }


    /* =====================================================
       MAIN CONTENT
    ===================================================== */

    .login-container {
      position: relative;

      z-index: 2;

      width: 100%;

      max-width: 430px;

      text-align: center;
    }


    /* =====================================================
       BRAND
    ===================================================== */

    .brand {
      margin-bottom: 24px;
    }


    .crown {
      display: block;

      font-size: 42px;

      line-height: 1;

      margin-bottom: 7px;

      transform-origin: center;

      animation:
        crownSpin 7s linear infinite;
    }


    @keyframes crownSpin {

      0% {
        transform: rotateY(0deg);
      }

      100% {
        transform: rotateY(360deg);
      }
    }


    .logo {
      font-size: 30px;

      font-weight: 900;

      letter-spacing: 1px;

      line-height: 1.1;

      text-shadow:
        0 3px 8px rgba(0, 0, 0, 0.5);
    }


    .logo span {
      color: #e1b83d;
    }


    .brand-name {
      margin-top: 6px;

      font-size: 11px;

      letter-spacing: 5px;

      color: #d9d9d9;

      opacity: 0.85;
    }


    /* =====================================================
       LOGIN CARD
    ===================================================== */

 .login-card {
  width: 100%;
  max-width: 380px;

  margin: 0 auto;

  padding: 24px 18px;

  border-radius: 18px;

  border: 1px solid rgba(255, 255, 255, 0.30);

  background: rgba(5, 15, 10, 0.58);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.55),
    inset 0 1px 0 rgba(255, 255, 255, 0.10);

  position: relative;
  overflow: hidden;
}

      background:
        rgba(5, 15, 10, 0.58);

      backdrop-filter: blur(18px);

      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55),

        inset 0 1px 0
        rgba(255, 255, 255, 0.10);

      position: relative;

      overflow: hidden;
    }


    /* subtle gold border glow */

    .login-card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 12%;
      right: 12%;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(231, 190, 68, 0.8),
          transparent
        );
    }


    /* =====================================================
       HEADING
    ===================================================== */

    h1 {
      font-size: 28px;

      font-weight: 800;

      margin-bottom: 8px;
    }


    .subtitle {
      color: #c7c7c7;

      font-size: 14px;

      line-height: 1.5;

      margin-bottom: 26px;
    }


    /* =====================================================
       INPUT GROUP
    ===================================================== */

    .input-group {
      text-align: left;

      margin-bottom: 17px;
    }


    .input-group label {
      display: block;

      color: #dddddd;

      font-size: 13px;

      font-weight: 600;

      margin-bottom: 7px;
    }


    .input-wrapper {
      position: relative;

      width: 100%;
    }


    input {
      display: block;

      width: 100%;

      height: 50px;

      padding:
        0 15px;

      border-radius: 10px;

      border: 1px solid
        rgba(255, 255, 255, 0.24);

      outline: none;

      background:
        rgba(0, 0, 0, 0.38);

      color: #ffffff;

      font-size: 15px;

      transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }


    input::placeholder {
      color: #929292;
    }


    input:focus {
      border-color: #d9ad35;

      box-shadow:
        0 0 0 2px
        rgba(217, 173, 53, 0.10),

        0 0 14px
        rgba(217, 173, 53, 0.12);
    }


    /* =====================================================
       PASSWORD
    ===================================================== */

    .password-input {
      padding-right: 62px;
    }


    .show-password {
      position: absolute;

      right: 10px;

      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      color: #d9b445;

      font-size: 12px;

      font-weight: 600;

      cursor: pointer;

      padding: 7px;
    }


    /* =====================================================
       FORGOT PASSWORD
    ===================================================== */

    .forgot {
      display: block;

      text-align: right;

      margin-top: -3px;

      margin-bottom: 20px;

      color: #e0b83f;

      font-size: 13px;

      text-decoration: none;
    }


    .forgot:hover {
      text-decoration: underline;
    }


    /* =====================================================
       LOGIN BUTTON
    ===================================================== */

    .login-btn {
      display: block;

      width: 100%;

      height: 50px;

      border: none;

      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          #b98b20,
          #f0ce62,
          #c49a2c
        );

      color: #071008;

      font-size: 16px;

      font-weight: 800;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
    }


    .login-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 22px
        rgba(215, 171, 50, 0.25);
    }


    .login-btn:active {
      transform: translateY(0);
    }


    .login-btn:disabled {
      opacity: 0.6;

      cursor: not-allowed;

      transform: none;
    }


    /* =====================================================
       DIVIDER
    ===================================================== */

    .divider {
      display: flex;

      align-items: center;

      gap: 11px;

      margin: 23px 0;

      color: #9d9d9d;

      font-size: 11px;

      letter-spacing: 1px;
    }


    .divider::before,
    .divider::after {
      content: "";

      flex: 1;

      height: 1px;

      background:
        rgba(255, 255, 255, 0.18);
    }


    /* =====================================================
       GOOGLE BUTTON
    ===================================================== */

    .google-btn {
      display: flex;

      align-items: center;

      justify-content: center;

      width: 100%;

      height: 48px;

      border-radius: 10px;

      border: 1px solid
        rgba(255, 255, 255, 0.25);

      background:
        rgba(255, 255, 255, 0.07);

      color: #ffffff;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }


    .google-btn:hover {
      background:
        rgba(255, 255, 255, 0.12);

      transform: translateY(-1px);
    }


    /* =====================================================
       SIGNUP LINK
    ===================================================== */

    .signup-text {
      margin-top: 23px;

      color: #bdbdbd;

      font-size: 13px;

      line-height: 1.5;
    }


    .signup-text a {
      color: #e0b83f;

      font-weight: 700;

      text-decoration: none;
    }


    .signup-text a:hover {
      text-decoration: underline;
    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    #message {
      min-height: 18px;

      margin-top: 15px;

      font-size: 13px;

      color: #d8d8d8;

      line-height: 1.4;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 480px) {

      body {
        padding: 18px 15px;
      }


      .login-container {
        max-width: 400px;
      }


      .brand {
        margin-bottom: 20px;
      }


      .crown {
        font-size: 38px;
      }


      .logo {
        font-size: 27px;
      }


      .login-card {
        padding: 28px 20px;

        border-radius: 20px;
      }


      h1 {
        font-size: 25px;
      }


      .subtitle {
        font-size: 13px;

        margin-bottom: 23px;
      }


      .liquid {
        width: 150px;
      }


      .liquid-two {
        width: 180px;
      }
    }


    /* =====================================================
       VERY SMALL PHONES
    ===================================================== */

    @media (max-width: 350px) {

      body {
        padding: 15px 10px;
      }


      .login-card {
        padding:
          24px 16px;
      }


      .logo {
        font-size: 24px;
      }


      h1 {
        font-size: 23px;
      }
    }

  </style>
</head>


<body>

  <!-- ===================================================
       LIQUID BACKGROUND
  ==================================================== -->

  <div class="fluid-bg">

    <div class="liquid liquid-one"></div>

    <div class="liquid liquid-two"></div>

    <div class="liquid liquid-three"></div>

  </div>


  <!-- ===================================================
       LOGIN CONTENT
  ==================================================== -->

  <main class="login-container">


    <!-- BRAND -->

    <div class="brand">

      <div class="crown">
        👑
      </div>

      <div class="logo">
        KING<span>SCALE</span>
      </div>

      <div class="brand-name">
        DIGITALS
      </div>

    </div>


    <!-- LOGIN CARD -->

    <section class="login-card">


      <h1>
        Welcome Back
      </h1>


      <p class="subtitle">
        Login to your Kingscale Digitals account
      </p>


      <!-- EMAIL LOGIN FORM -->

      <form id="loginForm">


        <div class="input-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            autocomplete="email"
            placeholder="Enter your email"
            required
          >

        </div>


        <div class="input-group">

          <label for="password">
            Password
          </label>


          <div class="input-wrapper">

            <input
              type="password"
              id="password"
              class="password-input"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            >


            <button
              type="button"
              class="show-password"
              id="togglePassword"
            >
              Show
            </button>

          </div>

        </div>


        <a
          href="#"
          class="forgot"
          id="forgotPassword"
        >
          Forgot password?
        </a>


        <button
          type="submit"
          class="login-btn"
          id="loginBtn"
        >
          Login
        </button>


      </form>


      <!-- DIVIDER -->

      <div class="divider">
        OR
      </div>


      <!-- GOOGLE LOGIN -->

      <button
        type="button"
        class="google-btn"
        id="googleLogin"
      >
        Continue with Google
      </button>


      <!-- SIGNUP -->

      <p class="signup-text">

        Don't have an account?

        <a href="../signup/index.html">
          Create Account
        </a>

      </p>


      <!-- MESSAGE -->

      <div id="message"></div>


    </section>

  </main>


  <!-- ===================================================
       FIREBASE
  ==================================================== -->

  <script type="module">
    import {
      auth,
      googleProvider,
      signInWithRedirect,
      getRedirectResult,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged,
      ensureUserDocument,
      friendlyAuthError,
      isFirebaseConfigured
    } from "../firebase.js";

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const googleBtn = document.getElementById("googleLogin");
    const message = document.getElementById("message");
    const togglePassword = document.getElementById("togglePassword");
    const forgotPassword = document.getElementById("forgotPassword");

    function setMessage(text, error = false) {
      message.textContent = text;
      message.style.color = error ? "#ff6666" : "#d9b445";
    }

    function setBusy(button, busy, text) {
      if (!button) return;
      button.disabled = busy;
      if (busy) button.dataset.originalText = button.textContent;
      button.textContent = busy ? text : (button.dataset.originalText || button.textContent);
    }

    if (!isFirebaseConfigured()) {
      setMessage("Firebase is not configured yet. Add your Firebase web config to firebase-config.js.", true);
    }

    // If Google redirected back to this page, finish the sign-in here.
    getRedirectResult(auth).then(async (result) => {
      if (!result?.user) return;
      await ensureUserDocument(result.user, { syncProfile: true });
      window.location.replace("../dashboard/index.html#home");
    }).catch((error) => setMessage(friendlyAuthError(error), true));

    onAuthStateChanged(auth, (user) => {
      if (user && !window.location.search.includes("error")) {
        // Do not immediately redirect while a redirect result is being resolved.
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        setMessage("Please enter your email and password.", true);
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setMessage("Please enter a valid email address.", true);
        return;
      }

      setBusy(loginBtn, true, "Logging in...");
      try {
        const credential = await signInWithEmailAndPassword(auth, email, password);
        await ensureUserDocument(credential.user, { syncProfile: true });
        setMessage("Login successful. Welcome back!");
        window.location.replace("../dashboard/index.html#home");
      } catch (error) {
        setMessage(friendlyAuthError(error), true);
      } finally {
        setBusy(loginBtn, false);
      }
    });

    togglePassword?.addEventListener("click", () => {
      const hidden = passwordInput.type === "password";
      passwordInput.type = hidden ? "text" : "password";
      togglePassword.textContent = hidden ? "Hide" : "Show";
    });

    googleBtn?.addEventListener("click", async () => {
      setBusy(googleBtn, true, "Connecting to Google...");
      setMessage("Opening Google sign-in...");
      try {
        await signInWithRedirect(auth, googleProvider);
      } catch (error) {
        setMessage(friendlyAuthError(error), true);
        setBusy(googleBtn, false);
      }
    });

    forgotPassword?.addEventListener("click", async (event) => {
      event.preventDefault();
      const email = emailInput.value.trim();
      if (!email) {
        setMessage("Enter your email first.", true);
        emailInput.focus();
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        setMessage("Password reset email sent. Check your inbox.");
      } catch (error) {
        setMessage(friendlyAuthError(error), true);
      }
    });
  </script>

</body>
</html>
